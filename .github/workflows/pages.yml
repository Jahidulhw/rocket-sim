name: pages

# Builds the viewer datasets and publishes web/ to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The SIL datasets fly the C++ flight computer, so build it first.
      - name: Build flight computer (CMake, g++)
        run: |
          cmake -S fc -B fc/build -DCMAKE_BUILD_TYPE=Release -DFC_WARNINGS_AS_ERRORS=ON
          cmake --build fc/build --parallel

      - name: C++ unit tests
        run: ctest --test-dir fc/build --output-on-failure

      - name: Run test suite (never publish unverified physics or flight software)
        run: python -m pytest -q

      - name: Generate viewer data into web/data/ (including SIL datasets)
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
